<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>管理员后台 - 玫瑰按摩</title>
 <style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; }
 .header { background: linear-gradient(135deg, #C2185B, #E91E63); color: #fff; padding: 16px; text-align: center; font-size: 18px; font-weight: bold; position: sticky; top: 0; z-index: 50; }
 .container { padding: 16px; max-width: 700px; margin: 0 auto; }
 .login-box { max-width: 360px; margin: 80px auto; background: #fff; padding: 30px; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
 .login-box input { width: 100%; padding: 12px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 15px; margin-bottom: 12px; }
 .btn { padding: 12px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; background: linear-gradient(135deg,#C2185B,#E91E63); color: #fff; }
 .btn:active { transform: scale(.98); }
 .btn:disabled { opacity: .6; cursor: not-allowed; }
 .btn-sm { padding: 7px 12px; font-size: 13px; }
 .btn-pass { background: #2E7D32; }
 .btn-reject { background: #F44336; }
 .btn-ghost { background: #fff; color: #C2185B; border: 1.5px solid #C2185B; }
 .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
 .tab { flex: 1; min-width: 70px; text-align: center; padding: 10px 6px; border-radius: 10px; background: #fff; cursor: pointer; font-size: 13px; border: 1.5px solid #eee; }
 .tab.active { background: #C2185B; color: #fff; border-color: #C2185B; }
 .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.05); }
 .tech-imgs { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
 .tech-imgs img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
 .tech-field { font-size: 13px; margin: 4px 0; }
 .tech-field b { color: #C2185B; min-width: 50px; display: inline-block; }
 .row-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
 .empty { text-align: center; color: #bbb; padding: 30px; font-size: 14px; }
 .notice-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
 .notice-del { color: #F44336; font-size: 13px; cursor: pointer; white-space: nowrap; padding-top: 4px; }
 .back-link { text-align: center; margin-top: 16px; font-size: 13px; color: #999; }
 .back-link a { color: #C2185B; text-decoration: none; }
 .hist-item { border-left: 3px solid #2E7D32; padding: 8px 12px; margin-bottom: 10px; background: #fafff9; border-radius: 0 8px 8px 0; }
 .hist-reject { border-color: #F44336; background: #fff9f9; }
 .hist-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
 .hist-meta { font-size: 12px; color: #888; }
 .hist-ok { color: #2E7D32; }
 .hist-no { color: #F44336; }
 .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.8); color: #fff; padding: 12px 28px; border-radius: 10px; font-size: 14px; z-index: 99999; }
 .info-bar { background: #E3F2FD; color: #1565C0; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; text-align: center; }
 .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
 .loading { text-align: center; padding: 30px; color: #bbb; }
 .form-input, .form-textarea { width: 100%; padding: 11px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 15px; margin-bottom: 10px; font-family: inherit; box-sizing: border-box; }
 .form-textarea { resize: vertical; min-height: 70px; }
 </style>
</head>
<body>
 <div class="header">🌹 管理员后台</div>

 <div id="loginView">
 <div class="login-box">
 <div style="text-align:center;font-size:15px;margin-bottom:16px;color:#666;">请输入管理员密码</div>
 <input type="password" id="adminPwd" placeholder="管理员密码" onkeydown="if(event.key==='Enter')adminLogin()">
 <button class="btn" onclick="adminLogin()">进入后台</button>
 <div class="back-link" style="margin-top:14px;"><a href="index.html">← 返回首页</a></div>
 </div>
 </div>

 <div id="adminView" style="display:none;">
 <div class="container">
 <div class="info-bar" id="cloudStatus">☁️ 正在连接云端...</div>

 <div class="tabs">
 <div class="tab active" id="tabReview" onclick="switchTab('review')">待审核 <span id="pendingCount"></span></div>
 <div class="tab" id="tabHistory" onclick="switchTab('history')">审核记录 <span id="historyCount"></span></div>
 <div class="tab" id="tabAll" onclick="switchTab('all')">全部技师</div>
 <div class="tab" id="tabNotice" onclick="switchTab('notice')">公告</div>
 </div>

 <div class="toolbar">
 <button class="btn btn-sm btn-ghost" onclick="loadAll()">🔄 刷新</button>
 </div>

 <div id="reviewPanel">
 <div id="pendingList"><div class="loading">加载中...</div></div>
 </div>

 <div id="historyPanel" style="display:none;">
 <div id="historyList"><div class="loading">加载中...</div></div>
 </div>

 <div id="allPanel" style="display:none;">
 <div id="allList"><div class="loading">加载中...</div></div>
 </div>

 <div id="noticePanel" style="display:none;">
 <div class="card">
 <input class="form-input" id="noticeTitle" placeholder="公告标题">
 <textarea class="form-textarea" id="noticeContent" placeholder="公告内容（支持多行）"></textarea>
 <button class="btn" onclick="addNotice()">发布公告</button>
 </div>
 <div id="noticeList"></div>
 </div>

 <div class="back-link" style="margin-top:20px;">
 <a href="index.html">← 返回首页</a> &nbsp;|&nbsp; <a href="javascript:adminLogout()">退出后台</a>
 </div>
 </div>
 </div>

<script>
function escapeHtml(str) {
 if (!str) return '';
 return String(str)
 .replace(/&/g,'&amp;')
 .replace(/</g,'&lt;')
 .replace(/>/g,'&gt;')
 .replace(/"/g,'&quot;')
 .replace(/'/g,'&#039;');
}
function formatTime(ts) {
 if(!ts) return '';
 var d=new Date(ts);
 var y=d.getFullYear();
 var m=String(d.getMonth()+1).padStart(2,'0');
 var day=String(d.getDate()).padStart(2,'0');
 var h=String(d.getHours()).padStart(2,'0');
 var mi=String(d.getMinutes()).padStart(2,'0');
 return y+'-'+m+'-'+day+' '+h+':'+mi;
}
function genId(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2);
}
</script>
 <script src="cloud.js"></script>
 <script>
 var ADMIN_PWD = 'admin123';
 var TECH_KEY = 'technicians';
 var LOG_KEY = 'audit_log';
 var NOTICE_KEY = 'notices';

 function toast(msg) {
 var el = document.createElement('div');
 el.className = 'toast';
 el.textContent = msg;
 document.body.appendChild(el);
 setTimeout(function () { el.remove(); }, 2200);
 }

 function adminLogin() {
 var pwd = document.getElementById('adminPwd').value;
 if (pwd === ADMIN_PWD) {
 localStorage.setItem('rose_admin_logged','1');
 document.getElementById('loginView').style.display = 'none';
 document.getElementById('adminView').style.display = 'block';
 loadAll();
 } else {
 toast('密码错误');
 }
 }

 function adminLogout() {
 if (confirm('确定退出？')){
 localStorage.removeItem('rose_admin_logged');
 location.reload();
 }
 }

 function lsGet(key, def) {
 try { var v = localStorage.getItem('rose_' + key); return v ? JSON.parse(v) : def; }
 catch (e) { return def; }
 }

 function lsSave(key, data, cb) {
 try { localStorage.setItem('rose_' + key, JSON.stringify(data)); } catch (e) {}
 Cloud.save(key, data, cb);
 }

 function setCloudStatus(text, color, bg) {
 var el = document.getElementById('cloudStatus');
 el.textContent = text;
 el.style.background = bg || '#E3F2FD';
 el.style.color = color || '#1565C0';
 }

 function loadAll() {
 document.getElementById('cloudStatus').textContent = '☁️ 正在连接云端...';
 document.getElementById('pendingList').innerHTML = '<div class="loading">加载中...</div>';
 document.getElementById('historyList').innerHTML = '<div class="loading">加载中...</div>';
 document.getElementById('allList').innerHTML = '<div class="loading">加载中...</div>';
 document.getElementById('noticeList').innerHTML = '<div class="loading">加载中...</div>';

 Cloud.test(function (ok) {
 if (!ok) {
 setCloudStatus('⚠️ 云端不可用（本地模式）', '#E65100', '#FFF3E0');
 var techs = lsGet('technicians', []);
 var logs = lsGet('audit_log', []);
 var notes = lsGet('notices', []);
 renderPending(techs);
 renderAll(techs);
 renderHistory(logs);
 renderNotices(notes);
 updateCounts(techs, logs);
 return;
 }
 setCloudStatus('☁️ 云端已连接（所有设备数据实时同步）');
 Cloud.load(TECH_KEY, [], function (techs) {
 renderPending(techs || []);
 renderAll(techs || []);
 updateCounts(techs || [], null);
 });
 Cloud.load(LOG_KEY, [], function (logs) {
 renderHistory(logs || []);
 updateCounts(null, logs || []);
 });
 Cloud.load(NOTICE_KEY, [], function (notes) { renderNotices(notes || []); });
 });
 }

 function updateCounts(techs, logs) {
 var pending = (techs || []).filter(function (t) { return t.status === '待审核'; });
 document.getElementById('pendingCount').textContent = pending.length ? '(' + pending.length + ')' : '';
 document.getElementById('historyCount').textContent = ((logs || []).length) ? '(' + (logs || []).length + ')' : '';
 }

 function renderCard(t, showButtons) {
 var imgs = (t.photos || []).map(function (p) { return '<img src="' + p + '">'; }).join('');
 var statusColor = t.status === '已通过' ? '#2E7D32' : t.status === '已拒绝' ? '#F44336' : '#FF9800';
 var btns = '';
 if (showButtons) {
 btns = '<div class="row-btns">' +
 '<button class="btn btn-pass btn-sm" onclick="approve(\'' + t.id + '\')">✅ 通过</button>' +
 '<button class="btn btn-reject btn-sm" onclick="reject(\'' + t.id + '\')">❌ 拒绝</button>' +
 '</div>';
 }
 return '<div class="card">' +
 '<div class="tech-imgs">' + (imgs || '<div style="color:#bbb;font-size:12px;padding:8px;">无照片</div>') + '</div>' +
 '<div class="tech-field"><b>姓名：</b>' + escapeHtml(t.name) + ' <span style="color:' + statusColor + ';font-size:12px;">[' + escapeHtml(t.status || '待审核') + ']</span></div>' +
 '<div class="tech-field"><b>电话：</b>' + escapeHtml(t.phone) + '</div>' +
 '<div class="tech-field"><b>地址：</b>' + escapeHtml(t.address) + '</div>' +
 '<div class="tech-field"><b>价格：</b>¥' + escapeHtml(t.price) + ' / 次</div>' +
 '<div class="tech-field"><b>项目：</b>' + escapeHtml(t.services) + '</div>' +
 '<div class="tech-field" style="color:#888;"><b>账号：</b>' + escapeHtml(t.account || '') + '</div>' +
 '<div class="tech-field" style="color:#888;"><b>提交：</b>' + formatTime(t.submitTime) + '</div>' +
 btns +
 '</div>';
 }

 function renderPending(list) {
 var pending = list.filter(function (t) { return t.status === '待审核'; });
 var box = document.getElementById('pendingList');
 if (pending.length === 0) {
 box.innerHTML = '<div class="empty">⭐ 暂无待审核申请</div>';
 return;
 }
 box.innerHTML = pending.map(function (t) { return renderCard(t, true); }).join('');
 }

 function renderAll(list) {
 var box = document.getElementById('allList');
 if (list.length === 0) {
 box.innerHTML = '<div class="empty">暂无技师数据</div>';
 return;
 }
 box.innerHTML = list.map(function (t) { return renderCard(t, false); }).join('');
 }

 function doAudit(id, action) {
 Cloud.load(TECH_KEY, [], function (list) {
 var tech = null;
 for (var i = 0; i < list.length; i++) {
 if (list[i].id === id) { tech = list[i]; break; }
 }
 if (!tech) { toast('未找到该记录'); return; }

 tech.status = action === 'approve' ? '已通过' : '已拒绝';
 tech.auditTime = Date.now();

 lsSave(TECH_KEY, list, function () {});

 Cloud.load(LOG_KEY, [], function (logs) {
 logs = logs || [];
 logs.unshift({
 id: tech.id,
 name: tech.name,
 phone: tech.phone,
 account: tech.account || '',
 action: action === 'approve' ? '通过' : '拒绝',
 time: Date.now()
 });
 if (logs.length > 500) logs = logs.slice(0, 500);
 lsSave(LOG_KEY, logs, function () {});
 });

 toast(action === 'approve' ? '已通过 ✓' : '已拒绝 ✗');
 loadAll();
 });
 }

 function approve(id) { doAudit(id, 'approve'); }
 function reject(id) { doAudit(id, 'reject'); }

 function renderHistory(logs) {
 var box = document.getElementById('historyList');
 if (logs.length === 0) {
 box.innerHTML = '<div class="empty">暂无审核记录</div>';
 return;
 }
 box.innerHTML = logs.map(function (e) {
 var cls = e.action === '通过' ? 'hist-ok' : 'hist-no';
 var borderCls = e.action === '通过' ? '' : ' hist-reject';
 return '<div class="card hist-item' + borderCls + '">' +
 '<div class="hist-name">' + escapeHtml(e.name) + ' <span class="' + cls + '" style="font-size:13px;">【' + escapeHtml(e.action) + '】</span></div>' +
 '<div class="hist-meta">电话：' + escapeHtml(e.phone || '') + ' | 账号：' + escapeHtml(e.account || '') + '</div>' +
 '<div class="hist-meta">' + formatTime(e.time) + '</div>' +
 '</div>';
 }).join('');
 }

 function switchTab(t) {
 document.getElementById('tabReview').className = 'tab' + (t === 'review' ? ' active' : '');
 document.getElementById('tabHistory').className = 'tab' + (t === 'history' ? ' active' : '');
 document.getElementById('tabAll').className = 'tab' + (t === 'all' ? ' active' : '');
 document.getElementById('tabNotice').className = 'tab' + (t === 'notice' ? ' active' : '');
 document.getElementById('reviewPanel').style.display = t === 'review' ? 'block' : 'none';
 document.getElementById('historyPanel').style.display = t === 'history' ? 'block' : 'none';
 document.getElementById('allPanel').style.display = t === 'all' ? 'block' : 'none';
 document.getElementById('noticePanel').style.display = t === 'notice' ? 'block' : 'none';
 }

 function addNotice() {
 var title = document.getElementById('noticeTitle').value.trim();
 var content = document.getElementById('noticeContent').value.trim();
 if (!title || !content) { toast('请填写标题和内容'); return; }
 Cloud.load(NOTICE_KEY, [], function (list) {
 list = list || [];
 list.unshift({ id: genId(), title: title, content: content, time: Date.now() });
 lsSave(NOTICE_KEY, list, function () {
 document.getElementById('noticeTitle').value = '';
 document.getElementById('noticeContent').value = '';
 toast('公告已发布');
 renderNotices(list);
 });
 });
 }
 }

 function renderNotices(list) {
 var box = document.getElementById('noticeList');
 if (list.length === 0) { box.innerHTML = '<div class="empty">暂无公告</div>'; return; }
 box.innerHTML = list.map(function (n) {
 return '<div class="card notice-item">' +
 '<div style="flex:1;">' +
 '<b style="font-size:15px;">' + escapeHtml(n.title) + '</b>' +
 '<div style="font-size:13px;color:#555;margin-top:6px;white-space:pre-wrap;line-height:1.5;">' + escapeHtml(n.content) + '</div>' +
 '<div style="font-size:11px;color:#bbb;margin-top:8px;">' + formatTime(n.time) + '</div></div>' +
 '<div class="notice-del" onclick="delNotice(\'' + n.id + '\')">删除</div>' +
 '</div>';
 }).join('');
 }

 function delNotice(id) {
 if (!confirm('确定删除该公告？')) return;
 Cloud.load(NOTICE_KEY, [], function (list) {
 list = (list || []).filter(function (n) { return n.id !== id; });
 lsSave(NOTICE_KEY, list, function () { toast('已删除'); renderNotices(list); });
 });
 }

 if(localStorage.getItem('rose_admin_logged') === '1'){
 document.getElementById('loginView').style.display = 'none';
 document.getElementById('adminView').style.display = 'block';
 loadAll();
 }
 </script>
</body>
</html>
