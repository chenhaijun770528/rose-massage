<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 玫瑰按摩</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #FFF5F7; color: #333; min-height: 100vh; padding-bottom: 40px;
    }
    .header {
      background: linear-gradient(135deg, #C2185B, #E91E63); color: #fff;
      padding: 16px; text-align: center; font-size: 18px; font-weight: bold;
    }
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 13px; color: #666; margin-bottom: 6px; display: block; font-weight: 500; }
    .form-input, .form-textarea {
      width: 100%; padding: 11px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px;
      font-size: 15px; outline: none; transition: border-color .2s; font-family: inherit;
    }
    .form-input:focus, .form-textarea:focus { border-color: #C2185B; }
    .form-textarea { resize: vertical; min-height: 70px; }
    .btn {
      width: 100%; padding: 13px; background: linear-gradient(135deg, #C2185B, #E91E63);
      color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold;
      cursor: pointer; margin-top: 6px;
    }
    .btn:active { transform: scale(.98); }
    .btn-ghost { background: #fff; color: #C2185B; border: 1.5px solid #C2185B; }
    .status-tip { font-size: 13px; padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; }
    .tip-wait { background: #FFF3E0; color: #E65100; }
    .tip-ok { background: #E8F5E9; color: #2E7D32; }
    .photos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    .photo-item { position: relative; width: 80px; height: 80px; border-radius: 10px; overflow: hidden; background: #f3e4e9; }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; }
    .photo-del { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.6); color: #fff;
      width: 20px; height: 20px; border-radius: 50%; font-size: 12px; line-height: 20px; text-align: center; cursor: pointer; }
    .photo-add { width: 80px; height: 80px; border: 1.5px dashed #C2185B; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 28px; color: #C2185B; cursor: pointer; }
    .link-row { display: flex; gap: 10px; }
    .link-row .btn { margin-top: 0; }
    .empty { text-align: center; color: #bbb; padding: 40px 20px; }
    .empty a { color: #C2185B; }
    .toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,.8); color: #fff; padding: 12px 28px; border-radius: 10px;
      font-size: 14px; z-index: 9999;
    }
    .cloud-box { font-size: 13px; color: #666; }
    .cloud-box .form-input { margin-bottom: 8px; }
    .settings-toggle { color: #C2185B; font-size: 13px; cursor: pointer; text-decoration: underline; }
    .logout-btn { color: #999; font-size: 13px; cursor: pointer; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">个人中心</div>
  <div class="container">
    <div id="loggedOut" class="empty">
      请先 <a href="login.html">登录</a> 或 <a href="register.html">注册</a> 后填写技师资料
    </div>

    <div id="loggedIn" style="display:none;">
      <div id="statusTip"></div>

      <div class="card">
        <div class="form-group">
          <label class="form-label">技师姓名 *</label>
          <input class="form-input" id="name" placeholder="例如：小芳">
        </div>
        <div class="form-group">
          <label class="form-label">联系电话 *</label>
          <input class="form-input" id="phone" placeholder="例如：13800138000">
        </div>
        <div class="form-group">
          <label class="form-label">服务地址 *</label>
          <input class="form-input" id="address" placeholder="例如：南京市XX路XX号">
        </div>
        <div class="form-group">
          <label class="form-label">价格（元/次）*</label>
          <input class="form-input" id="price" placeholder="例如：198">
        </div>
        <div class="form-group">
          <label class="form-label">服务项目 *</label>
          <textarea class="form-textarea" id="services" placeholder="例如：全身推拿、肩颈按摩、精油SPA"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">形象照片（最多3张）</label>
          <div class="photos" id="photoBox"></div>
          <div class="photo-add" id="photoAdd" onclick="document.getElementById('photoFile').click()">+</div>
          <input type="file" id="photoFile" accept="image/*" multiple style="display:none;" onchange="onPhotos(event)">
        </div>
      </div>

      <button class="btn" id="submitBtn" onclick="submitOrUpdate()">提交审核</button>

      <div class="card cloud-box" style="margin-top:16px;">
        <div class="settings-toggle" onclick="toggleCloud()">⚙️ 云端同步设置（多设备共享数据）</div>
        <div id="cloudPanel" style="display:none; margin-top:10px;">
          <input class="form-input" id="gistId" placeholder="Gist ID">
          <input class="form-input" id="gistToken" placeholder="GitHub Token（仅 gist 权限）">
          <button class="btn btn-ghost" onclick="saveCloud()">保存并测试连接</button>
          <div id="cloudStatus" style="margin-top:8px;"></div>
        </div>
      </div>

      <div class="logout-btn" onclick="logout()">退出登录</div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="cloud.js"></script>
  <script>
    var currentTech = null;
    var photos = [];

    function toggleCloud() {
      var p = document.getElementById('cloudPanel');
      p.style.display = p.style.display === 'none' ? 'block' : 'none';
      if (p.style.display === 'block') {
        document.getElementById('gistId').value = Storage.get('cloud_gist', '');
        document.getElementById('gistToken').value = Storage.get('cloud_token', '');
      }
    }

    function saveCloud() {
      var gid = document.getElementById('gistId').value.trim();
      var tok = document.getElementById('gistToken').value.trim();
      Storage.set('cloud_gist', gid);
      Storage.set('cloud_token', tok);
      Cloud.init();
      var st = document.getElementById('cloudStatus');
      if (!Cloud.enabled()) { st.textContent = '请填写完整的 Gist ID 和 Token'; st.style.color = '#F44336'; return; }
      Cloud.readAll(function (files) {
        if (files) { st.textContent = '✅ 云端连接成功'; st.style.color = '#2E7D32'; }
        else { st.textContent = '❌ 连接失败，请检查 Gist ID 和 Token'; st.style.color = '#F44336'; }
      });
    }

    function renderPhotos() {
      var box = document.getElementById('photoBox');
      var html = '';
      for (var i = 0; i < photos.length; i++) {
        html += '<div class="photo-item"><img src="' + photos[i] + '"><div class="photo-del" onclick="delPhoto(' + i + ')">×</div></div>';
      }
      box.innerHTML = html;
      document.getElementById('photoAdd').style.display = photos.length >= 3 ? 'none' : 'flex';
    }

    function delPhoto(i) { photos.splice(i, 1); renderPhotos(); }

    function onPhotos(e) {
      var files = e.target.files;
      if (!files || files.length === 0) return;
      var remain = 3 - photos.length;
      var toProcess = Math.min(remain, files.length);
      var done = 0;
      for (var i = 0; i < toProcess; i++) {
        compressImage(files[i], 800, 800, 0.7, function (b64) {
          if (b64) photos.push(b64);
          if (++done === toProcess) renderPhotos();
        });
      }
      e.target.value = '';
    }

    function submitOrUpdate() {
      var user = getCurrentUser();
      if (!user) { location.href = 'login.html'; return; }
      var name = document.getElementById('name').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var address = document.getElementById('address').value.trim();
      var price = document.getElementById('price').value.trim();
      var services = document.getElementById('services').value.trim();

      if (!name || !phone || !address || !price || !services) { toast('请填写所有必填项'); return; }
      if (photos.length === 0) { toast('请至少上传一张照片'); return; }

      Cloud.init();
      Cloud.load('technicians', [], function (list) {
        var existing = null;
        for (var i = 0; i < list.length; i++) {
          if (list[i].accountId === user.id) { existing = list[i]; break; }
        }
        if (existing) {
          // 修改：保持原状态（已通过则直接渲染）
          existing.name = name; existing.phone = phone; existing.address = address;
          existing.price = price; existing.services = services; existing.photos = photos;
          existing.updateTime = Date.now();
        } else {
          list.unshift({
            id: genId(), accountId: user.id, account: user.account,
            name: name, phone: phone, address: address, price: price,
            services: services, photos: photos, status: '待审核', submitTime: Date.now()
          });
        }
        Cloud.save('technicians', list, function () {
          toast(existing ? '资料已更新' : '已提交，等待审核');
          setTimeout(loadPage, 1000);
        });
      });
    }

    function loadPage() {
      var user = getCurrentUser();
      if (!user) {
        document.getElementById('loggedOut').style.display = 'block';
        document.getElementById('loggedIn').style.display = 'none';
        return;
      }
      document.getElementById('loggedOut').style.display = 'none';
      document.getElementById('loggedIn').style.display = 'block';

      Cloud.init();
      Cloud.test(function (ok) {
        var el = document.getElementById('cloudAuto');
        if (el) {
          el.textContent = ok ? '☁️ 云端：已连接（多设备同步开启）' : '📱 云端：离线（本机可用，联网后自动同步）';
          el.style.color = ok ? '#2E7D32' : '#999';
        }
      });
      Cloud.load('technicians', [], function (list) {
        currentTech = null;
        for (var i = 0; i < list.length; i++) {
          if (list[i].accountId === user.id) { currentTech = list[i]; break; }
        }
        var tip = document.getElementById('statusTip');
        var btn = document.getElementById('submitBtn');
        if (currentTech) {
          document.getElementById('name').value = currentTech.name || '';
          document.getElementById('phone').value = currentTech.phone || '';
          document.getElementById('address').value = currentTech.address || '';
          document.getElementById('price').value = currentTech.price || '';
          document.getElementById('services').value = currentTech.services || '';
          photos = currentTech.photos ? currentTech.photos.slice() : [];
          renderPhotos();
          if (currentTech.status === '待审核') {
            tip.className = 'status-tip tip-wait';
            tip.textContent = '⏳ 资料审核中，审核通过后将展示在首页';
            btn.textContent = '修改资料';
          } else if (currentTech.status === '已拒绝') {
            tip.className = 'status-tip tip-wait';
            tip.textContent = '❌ 审核未通过，可修改后重新提交';
            btn.textContent = '重新提交';
          } else {
            tip.className = 'status-tip tip-ok';
            tip.textContent = '✅ 资料已通过，展示在首页（修改将直接生效）';
            btn.textContent = '保存修改';
          }
        } else {
          tip.className = '';
          tip.textContent = '';
          photos = [];
          renderPhotos();
          btn.textContent = '提交审核';
        }
      });
    }
    loadPage();
  </script>
</body>
</html>
