<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 玫瑰按摩</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #FFF5F7, #FFF0F5); min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: linear-gradient(135deg, #C2185B, #E91E63); color: #fff; padding: 18px; text-align: center; font-size: 20px; font-weight: bold; }
    .card { background: #fff; margin: 20px 16px; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(194,24,91,.1); }
    .form-group { margin-bottom: 18px; }
    .form-label { font-size: 14px; color: #666; margin-bottom: 6px; display: block; font-weight: 500; }
    .form-input { width: 100%; padding: 13px 16px; border: 1.5px solid #e0e0e0; border-radius: 12px; font-size: 16px; outline: none; font-family: inherit; }
    .form-input:focus { border-color: #C2185B; }
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #C2185B, #E91E63); color: #fff; border: none; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .link { text-align: center; margin-top: 16px; font-size: 14px; color: #999; }
    .link a { color: #C2185B; text-decoration: none; }
    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.8); color: #fff; padding: 14px 30px; border-radius: 12px; font-size: 15px; z-index: 99999; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="header">🌹 登录</div>
  <div class="card">
    <div class="form-group">
      <label class="form-label">手机号码</label>
      <input class="form-input" id="account" type="tel" maxlength="11" placeholder="请输入注册手机号">
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input class="form-input" id="password" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">登录</button>
    <div class="link">还没有账号？<a href="register.html">立即注册</a></div>
    <div class="link"><a href="index.html">← 返回首页</a></div>
  </div>
  <script src="common.js"></script>
  <script src="cloud.js"></script>
  <script>
    function toast(msg) {
      var el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(function () { el.remove(); }, 2000);
    }

    function doLogin() {
      var account = document.getElementById('account').value.trim();
      var password = document.getElementById('password').value;
      if (!account || !password) { toast('请输入手机号和密码'); return; }

      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = '登录中...';

      Cloud.load('accounts', [], function (list) {
        var found = null;
        for (var i = 0; i < list.length; i++) {
          if (list[i].account === account) { found = list[i]; break; }
        }
        if (!found) {
          btn.disabled = false;
          btn.textContent = '登录';
          toast('该手机号未注册');
          return;
        }
        if (found.password !== password) {
          btn.disabled = false;
          btn.textContent = '登录';
          toast('密码错误');
          return;
        }
        // 登录成功
        Storage.set('current_user', { id: found.id, account: found.account });
        toast('登录成功！');
        setTimeout(function () { location.href = 'profile.html'; }, 500);
      });
    }
  </script>
</body>
</html>
