<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册账号 - 玫瑰按摩</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #FFF5F7, #FFF0F5); min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: linear-gradient(135deg, #C2185B, #E91E63); color: #fff; padding: 18px; text-align: center; font-size: 20px; font-weight: bold; }
    .card { background: #fff; margin: 20px 16px; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(194,24,91,.1); }
    .form-group { margin-bottom: 18px; }
    .form-label { font-size: 14px; color: #666; margin-bottom: 6px; display: block; font-weight: 500; }
    .form-input { width: 100%; padding: 13px 16px; border: 1.5px solid #e0e0e0; border-radius: 12px; font-size: 16px; outline: none; transition: border-color .2s; font-family: inherit; }
    .form-input:focus { border-color: #C2185B; }
    .form-input.error { border-color: #F44336; }
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #C2185B, #E91E63); color: #fff; border: none; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .link { text-align: center; margin-top: 16px; font-size: 14px; color: #999; }
    .link a { color: #C2185B; text-decoration: none; }
    .error-msg { color: #F44336; font-size: 12px; margin-top: 4px; display: none; }
    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.8); color: #fff; padding: 14px 30px; border-radius: 12px; font-size: 15px; z-index: 99999; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="header">🌹 注册账号</div>

  <div class="card">
    <div class="form-group">
      <label class="form-label">手机号码（作为账号）</label>
      <input class="form-input" id="account" type="tel" maxlength="11" placeholder="请输入手机号码" autocomplete="off">
      <div class="error-msg" id="accountErr">请输入正确的手机号</div>
    </div>
    <div class="form-group">
      <label class="form-label">设置密码</label>
      <input class="form-input" id="password" type="password" placeholder="请设置登录密码（6位以上）">
      <div class="error-msg" id="pwdErr">密码至少6位</div>
    </div>
    <div class="form-group">
      <label class="form-label">确认密码</label>
      <input class="form-input" id="password2" type="password" placeholder="请再次输入密码">
      <div class="error-msg" id="pwd2Err">两次密码不一致</div>
    </div>
    <button class="btn" id="regBtn" onclick="doRegister()">注册并跳转填写资料</button>
    <div class="link">已有账号？<a href="login.html">立即登录</a></div>
    <div class="link" style="margin-top:8px;"><a href="index.html">← 返回首页</a></div>
  </div>

  <script src="common.js"></script>
  <script src="cloud.js"></script>
  <script>
    function toast(msg) {
      var el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(function () { el.remove(); }, 2000);
    }

    function doRegister() {
      var account = document.getElementById('account').value.trim();
      var password = document.getElementById('password').value;
      var password2 = document.getElementById('password2').value;

      // 验证
      document.querySelectorAll('.error-msg').forEach(function (el) { el.style.display = 'none'; });
      document.querySelectorAll('.form-input').forEach(function (el) { el.classList.remove('error'); });
      var hasErr = false;

      if (!/^1\d{10}$/.test(account)) {
        document.getElementById('accountErr').style.display = 'block';
        document.getElementById('account').classList.add('error');
        hasErr = true;
      }
      if (password.length < 6) {
        document.getElementById('pwdErr').style.display = 'block';
        document.getElementById('password').classList.add('error');
        hasErr = true;
      }
      if (password !== password2) {
        document.getElementById('pwd2Err').style.display = 'block';
        document.getElementById('password2').classList.add('error');
        hasErr = true;
      }
      if (hasErr) return;

      var btn = document.getElementById('regBtn');
      btn.disabled = true;
      btn.textContent = '正在提交...';

      // 1. 先从云端读取现有账号
      Cloud.load('accounts', [], function (list) {
        // 2. 检查重复
        for (var i = 0; i < list.length; i++) {
          if (list[i].account === account) {
            btn.disabled = false;
            btn.textContent = '注册并跳转填写资料';
            toast('该手机号已注册，请直接登录');
            return;
          }
        }

        // 3. 创建新账号
        var newAccount = {
          id: 'acc_' + Date.now(),
          account: account,
          password: password,
          created: Date.now()
        };
        list.unshift(newAccount);

        // 4. 写入云端
        Cloud.saveNow('accounts', list, function (ok) {
          if (ok) {
            // 5. 本地记住登录状态
            Storage.set('current_user', { id: newAccount.id, account: newAccount.account });
            toast('注册成功！');
            setTimeout(function () { location.href = 'profile.html'; }, 600);
          } else {
            btn.disabled = false;
            btn.textContent = '注册并跳转填写资料';
            toast('网络异常，请重试');
          }
        });
      });
    }
  </script>
</body>
</html>
